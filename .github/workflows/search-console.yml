name: Search Console

# Holt die Search-Console-Zahlen woechentlich und legt sie im Repo ab.
# Der Service-Account-Schluessel steckt im Secret GOOGLE_SERVICE_ACCOUNT_JSON
# und taucht nirgends im Repo auf.
# Einrichtung: tools/search-console/README.md

on:
  schedule:
    - cron: '0 5 * * 1'   # montags 05:00 UTC
  workflow_dispatch:       # und auf Zuruf
  # Bei Aenderungen an den Skripten selbst laeuft alles einmal echt durch,
  # aber ohne zu committen. So ist jede Aenderung vor dem Merge gegen die
  # echte API getestet und nicht nur gegen eine Attrappe.
  pull_request:
    paths:
      - 'tools/search-console/**'
      - '.github/workflows/search-console.yml'

permissions:
  contents: write          # nur zum Committen der abgeholten Daten

concurrency:
  # Ohne das wuerden ein manueller Lauf und der Montags-Zeitplan sich beim
  # Push gegenseitig abweisen, wenn sie sich ueberschneiden - genau das ist
  # in diesem Projekt schon vorgekommen, als der Lauf mehrfach von Hand
  # angestossen wurde, um das fehlende Secret zu pruefen.
  # PR-Laeufe in eine eigene Gruppe: Sonst kann ein PR-Push einen
  # wartenden Zeitplan-Lauf still verdraengen (eine Gruppe haelt nur einen
  # wartenden Lauf).
  group: search-console-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  abholen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten
        run: pip install --quiet google-auth requests

      # Ohne Secret bricht der Lauf mit einer klaren Meldung ab, statt
      # eine leere Datei zu committen und Erfolg zu melden.
      - name: Secret vorhanden?
        env:
          KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            mkdir -p data/search-console
            {
              echo "# Letzter Lauf"
              echo
              echo "**$(date -u '+%d.%m.%Y %H:%M') UTC** — **gescheitert**"
              echo
              echo '```'
              echo "GOOGLE_SERVICE_ACCOUNT_JSON fehlt."
              echo '```'
              echo
              echo "Einrichtung: \`tools/search-console/README.md\`, Schritt 3."
            } > data/search-console/LETZTER-LAUF.md
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON fehlt. Siehe tools/search-console/README.md"
            exit 1
          fi

      - name: Daten abholen
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:ergo-plus.de' }}
        run: python3 tools/search-console/fetch_gsc.py --tage 90

      # Welche Adressen der Sitemap Google ueberhaupt im Index hat. Die
      # Zahlen oben zeigen nur Seiten mit Impressionen; eine Seite, die nie
      # im Index war, faellt dort nie auf. Braucht keine neue Freigabe:
      # derselbe Service Account, dieselbe Rolle.
      - name: Index pruefen
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'sc-domain:ergo-plus.de' }}
        run: python3 tools/search-console/index_waechter.py --sitemap sitemap.xml

      - name: Index im Protokoll
        if: always()
        run: |
          if [ -f data/search-console/INDEX.md ]; then
            cat data/search-console/INDEX.md >> "$GITHUB_STEP_SUMMARY"
            # Als Anmerkungen am Lauf und am PR sichtbar, auch ohne die
            # Zusammenfassung zu oeffnen.
            python3 -c "
          import json
          d = json.load(open('data/search-console/index.json'))
          print(f\"::notice title=Index::{d['im_index']} von {d['adressen']} Sitemap-Adressen im Google-Index\")
          for e in d['ergebnisse']:
              if not e['im_index']:
                  print(f\"::warning title=Nicht im Index::{e['url']} - {e['zustand'] or e['urteil'] or 'ohne Angabe'}\")
          "
          fi

      # Laeuft auch nach einem Fehlschlag: sonst bliebe der Laufbericht, der
      # den Fehlschlag erklaert, im Container liegen und niemand saehe ihn.
      - name: Aenderungen committen
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/search-console
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Search-Console-Daten: Stand $(date -u +%Y-%m-%d)"
            # Zwei Workflows schreiben ins Repo. Laufen sie gleichzeitig,
            # wird der zweite Push abgewiesen, weil main inzwischen weiter
            # ist. Erst den neuen Stand holen, dann pushen; dreimal.
            for versuch in 1 2 3; do
              git pull --rebase -q origin main && git push && break
              echo "Push abgewiesen, Versuch $versuch"; sleep 5
              [ "$versuch" = 3 ] && exit 1
            done
          fi
